# Single migration file for the Innovation Pipeline Prioritisation process.
# Re-projects the ontology and process definitions into the context-graph.
#
# ingest_ontology is idempotent per-migration id and 0001-0003 have already been
# applied (.contextgraph/applied.lock), so a new process added to this ALREADY
# APPLIED graph needs its own migration id to be picked up. Not needed if the graph
# is instead rebuilt from scratch via a GitHub push — a fresh build projects the
# current YAML with no already-applied ingest_ontology state to work around.

id: 0004_innovation_pipeline_prioritisation
description: |
  Ingests the complete Innovation Pipeline Prioritisation process definition into the
  graph context: the scoring step over V_PIPELINE_PRIORITY_CANDIDATES, the three
  unrolled external market-research steps, the finalisation step, the single publish
  gate, and the context_package data queries (active_briefs, category_signal,
  active_categories) plus the key-data cards behind them.
created_at: 2026-08-05
operations:
  - kind: ingest_ontology
