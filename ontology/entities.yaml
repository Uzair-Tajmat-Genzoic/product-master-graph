# Business entity types for the product-master graph.
# Replaced 2026-08-31 with the FMCG template's 10 entity types (see
# .claude/plans/2026-08-31_fmcg-template-wipe.md for the full plan and the
# 20-entity ontology this superseded). Source template:
# context-graph/src/contextgraph/ontology/templates/fmcg.py
#
# Master/reference data only — no transactional entities (orders, shipments,
# purchase orders) are modeled here; that data is expected to be synced from
# a semantic model instead. `Products` is the central hub most other
# entities connect to. The distribution chain is `Plants -> Distribution
# Centers -> Channel`, with no third-party reseller modeled.

entities:

  - type: Products
    description: The sellable product — the central hub most other entities connect to — what's manufactured, stocked, inspected, promoted, and bought.
    properties:
      - { name: product_name,   type: string, required: true }
      - { name: launch_date,    type: string }
      - { name: mrp,            type: number }
      - { name: units_per_case, type: number }
      - { name: category_id,    type: string, hierarchy: ProductCategory }

  - type: Plants
    description: Manufacturing sites where Products are produced.
    properties:
      - { name: capacity_utilization_pct, type: number }
      - { name: ownership_type,           type: string }

  - type: Suppliers
    description: Vendors of raw materials/packaging feeding plants.
    properties:
      - { name: approval_status,    type: string }
      - { name: avg_lead_time_days, type: number }

  - type: DistributionCenters
    description: A company-owned warehouse that stores finished goods between production and the point of sale.
    properties:
      - { name: dc_name,          type: string }
      - { name: capacity,         type: number }
      - { name: safety_stock_qty, type: number }

  - type: Channel
    description: The point of sale — a specific, identifiable outlet/account (a store, a marketplace storefront, a dark store, a HoReCa account).
    properties:
      - { name: type, type: string, hierarchy: TradeChannel }

  - type: QualityInspections
    description: A QA or regulatory check on a product or plant.
    properties:
      - { name: certificate_id, type: string }
      - { name: result,         type: string }

  - type: Consumers
    description: End buyers driving product demand.
    properties:
      - { name: household_segment, type: string }
      - { name: penetration_pct,   type: number }

  - type: Regions
    description: A geographic sales/operations territory (e.g. zone, state) that Plants, Suppliers, DistributionCenters, and Channels all sit in.
    properties:
      - { name: region_name, type: string }
    # NOTE: FMCG's `parent_region_id` property was dropped — this project's
    # convention omits FKs from properties (hierarchy is modeled as a graph
    # relationship instead). FMCG itself defines no Region -> Region
    # relationship, so region nesting is not modeled here.

  - type: Campaigns
    description: A time-bound marketing or trade campaign driving demand for products.
    properties:
      - { name: campaign_name, type: string }
      - { name: start_date,    type: string }
      - { name: end_date,      type: string }
      - { name: budget,        type: number }

  - type: Materials
    description: A raw material or packaging component used in production (e.g. 'PET resin', 'Sugar'), sourced from a Supplier.
    properties:
      - { name: material_code,   type: string, identifier: true }
      - { name: material_name,   type: string }
      - { name: material_type,   type: string }
      - { name: unit_of_measure, type: string }
      - { name: unit_cost,       type: number }
