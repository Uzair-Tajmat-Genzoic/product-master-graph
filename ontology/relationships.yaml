# How the 10 FMCG entity types relate. 15 relationships.
# Replaced 2026-08-31 alongside entities.yaml — see
# .claude/plans/2026-08-31_fmcg-template-wipe.md for the full plan and the
# 26-relationship ontology this superseded. Source template:
# context-graph/src/contextgraph/ontology/templates/fmcg.py
#
# Relationship `type` names are hand-chosen (short, project-style) rather
# than the source template's auto-generated `from_verb_to` slugs, since
# these are authored directly in YAML rather than through the apply-template
# API. Cardinality reflects real-world FMCG semantics — the source template
# only marks cardinality explicitly on `sources_from`; the rest default to
# an unspecified 1:m there.

relationships:

  - type: produced_at
    description: A product is manufactured at a plant.
    from: Products
    to:   Plants
    cardinality: many-to-one

  - type: stocked_at
    description: A product is stocked at a channel (point of sale).
    from: Products
    to:   Channel
    cardinality: many-to-many

  - type: sources_from
    description: A plant sources raw materials/packaging from a supplier.
    from: Plants
    to:   Suppliers
    cardinality: many-to-many

  - type: purchases
    description: A consumer purchases a product.
    from: Consumers
    to:   Products
    cardinality: many-to-many

  - type: certifies_plant
    description: A quality inspection certifies a plant.
    from: QualityInspections
    to:   Plants
    cardinality: many-to-one

  - type: covers_product
    description: A quality inspection covers a product.
    from: QualityInspections
    to:   Products
    cardinality: many-to-many

  - type: plant_located_in
    description: A plant sits in a geographic sales/operations region.
    from: Plants
    to:   Regions
    cardinality: many-to-one

  - type: supplier_located_in
    description: A supplier sits in a geographic sales/operations region.
    from: Suppliers
    to:   Regions
    cardinality: many-to-one

  - type: channel_located_in
    description: A channel sits in a geographic sales/operations region.
    from: Channel
    to:   Regions
    cardinality: many-to-one

  - type: promotes
    description: A campaign promotes a product.
    from: Campaigns
    to:   Products
    cardinality: many-to-many

  - type: supplies_material
    description: A supplier supplies a material.
    from: Suppliers
    to:   Materials
    cardinality: many-to-many

  - type: requires_material
    description: A product requires a material (bill of materials).
    from: Products
    to:   Materials
    cardinality: many-to-many

  - type: ships_to
    description: A plant ships finished goods to a distribution center.
    from: Plants
    to:   DistributionCenters
    cardinality: many-to-many

  - type: replenishes
    description: A distribution center replenishes stock at a channel.
    from: DistributionCenters
    to:   Channel
    cardinality: many-to-many

  - type: dc_located_in
    description: A distribution center sits in a geographic sales/operations region.
    from: DistributionCenters
    to:   Regions
    cardinality: many-to-one
