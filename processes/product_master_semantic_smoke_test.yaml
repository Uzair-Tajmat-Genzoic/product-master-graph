version: 1

# ---------------------------------------------------------------------------
# Product Master — Conversational Analytics Smoke Test, the SKILL path
#
# The A/B twin of the sibling `product_master_semantic_smoke_test.yaml`. Both ask the
# SAME Data Agent the SAME question; only the route differs:
#
#   sibling (context-graph path)   this file (skill path)
#   ────────────────────────────   ─────────────────────────────────────────────
#   source: semantic_model         a step that NAMES the skill
#   -> ContextCollector            -> EventAgent._run_step_skill -> call_skill
#   -> POST /verified-queries/run  -> app/skills/google-conversational-analytics/
#   -> context-graph calls CA         scripts/ca_operations.py calls CA directly
#   creds: context-graph's         creds: the `google-conversational-analytics`
#          BigQuery adapter               WORKSPACE CONNECTOR
#
# Run both: identical rows prove the skill path is a drop-in for the context-graph
# one, which is what has to be true before that code can be retired. NOTHING is
# removed yet — the sibling process and context-graph's CA path both stay.
#
# Flow: EventAgent._run_step_skill -> _invoke_skill
#   -> call_skill("Google Conversational Analytics")
#   -> check_connector_readiness (the connector is `direct`, so the script branch)
#   -> ca_operations.py -> the CA Chat API (Gemini writes AND runs the SQL on BigQuery)
#   -> facts[<as>] = {success, sql, columns, rows, row_count, raw}
#
# WHY THIS NEEDS NO SEMANTIC MODEL FILE: a CA Data Agent owns its own tables and
# business context inside the Conversational Analytics console. It does NOT read
# `semantic_models/product_master_semantics.yaml` — that file is for the PLATFORM
# engine. So this process names an AGENT (like Genie), not a model file (like Cortex).
#
# `data_agent_id` below is the agent's DISPLAY NAME, resolved by the skill against the
# agents ticked in the connect dialog (id-first, then name, ambiguity refused) — the
# same rule the Genie and Cortex skills use. Paste the raw id
# (agent_a9064084-c92c-462f-a7e4-2b512478cc68) instead if you want it independent of the
# picker, or omit the key entirely when exactly one agent is ticked.
#
# LOCATION IS NOT PASSED HERE: it comes from the connection (`us`). It matters more than
# it looks — a regional agent is only reachable through its own
# geminidataanalytics.{loc}.rep.googleapis.com endpoint, and a mismatch answers
# 403 "Read access to project was denied", i.e. a wrong-host error dressed as a
# permissions error. Pass `location` on the step only to override the connection.
#
# ── BEFORE THIS RUNS ──────────────────────────────────────────────────────────
#   1. the `google-conversational-analytics` connector is connected for the org, with
#      the GCP project and the agent's region, and this agent TICKED in the picker
#      (press Test, tick, Save) — that is what makes the NAME below resolvable;
#   2. the "Google Conversational Analytics" skill is seeded and enabled for the running
#      user (make seed-skill SKILL='google-conversational-analytics'). RESEED after any
#      edit to ca_operations.py — the executor runs the script stored in the DB, not the
#      file on disk;
#   3. the service account can reach the published agent (Gemini Data Analytics Data
#      Agent User) and its BigQuery data (Data Viewer + Job User).
#
# The two skill steps run BEFORE the gate: `_decide_and_pause` calls
# `_prefetch_step_data` for each step ahead of the first gate, which runs its `skill`
# and folds the result into the facts bag. It SKIPS the LLM `produces` pass, so these
# steps carry a `skill:` and nothing else.
# ---------------------------------------------------------------------------

processes:
  - id: product_master_ca_skill_test
    name: Product Master — CA Skill Smoke Test
    description: |
      End-to-end test of the Google Conversational Analytics skill. Two natural-language
      questions are put to the Data Agent product_master_agent by naming the skill on a
      step; Gemini writes and runs the SQL on BigQuery and returns the rows plus the SQL.
      The first question is deliberately identical to the sibling
      product_master_semantic_smoke_test, which asks the same agent through context-graph
      — so the two runs can be compared directly. One review gate shows both; APPROVE if
      data came back.
    domain: Merchandising
    owner: data_team
    definition_type: text

    # Attach to Product. The bare binding sets the type; the filtered duplicate is what
    # makes a manual / entity run discover the process (same pattern as every sibling
    # here). Nothing below uses the entity — the skill call is self-contained.
    applies_to:
      - entity: Product
      - entity: Product
        where:
          - { field: id, op: ne, value: __none__ }

    triggers:
      - { type: manual, allowed_roles: [DataAnalyst, MerchandisingManager] }
      - { type: event, event_type: product_master_ca_skill_test }

    inputs:
      - { name: scheduled_at, type: datetime, required: false }

    outputs:
      - { name: decision, type: enum, values: [APPROVE, REJECT] }
      - { name: check_summary, type: string }

    steps:
      # 1. The SAME question the sibling asks through context-graph — that is the point.
      - id: ask_products_by_category
        name: Ask CA — active products by category
        type: agent
        description: The sibling process's exact question, routed through the skill instead.
        skill:
          name: Google Conversational Analytics
          operation: ask
          args:
            question: How many active products are in each category?
            data_agent_id: product_master_agent   # display name — the skill resolves it
            limit: 20    # small on purpose — a gate is for reading, not paging 500 rows
          as: ca_by_category

      # 2. A second, unrelated question, so a failure on one can be told apart from a
      #    broken connector: one failing is the agent's coverage, both failing is wiring.
      - id: ask_channel_listings
        name: Ask CA — product listings by channel
        type: agent
        after: ask_products_by_category
        description: A different question against the same agent.
        skill:
          name: Google Conversational Analytics
          operation: ask
          args:
            question: How many products are listed on each sales channel?
            data_agent_id: product_master_agent
            limit: 20
          as: ca_by_channel

      # 3. GATE — shows what CA returned.
      - id: review
        name: Review CA output
        type: decision
        after: ask_channel_listings
        description: Confirm the Conversational Analytics skill answered both questions.
        instruction: >
          Two questions were put to the Conversational Analytics Data Agent
          "product_master_agent" by calling the "Google Conversational Analytics" skill
          directly — Gemini wrote and ran the SQL on BigQuery; our platform generated
          nothing. Write a SHORT summary: for each, whether it succeeded, its row_count,
          and one concrete number from its rows. The first question is the SAME one the
          sibling process product_master_semantic_smoke_test asks through context-graph,
          so if you can see that run's result, say whether the two agree. If a fact failed,
          quote its `error` and `message` verbatim — that message is the whole diagnosis.
          Recommend APPROVE if at least one returned rows, which proves the connector, the
          skill and the agent all work end to end. REJECT if both failed. Do NOT re-query
          and do NOT call any tool.
        decision_options: [APPROVE, REJECT]
        produces: [check_summary]
        # One table view per card — the rows and nothing else, matching the Genie and
        # Cortex smoke tests. The SQL Gemini wrote is on the fact but not rendered; the
        # agent reads it for the summary.
        key_data:
          - title: "Active products by category (via CA skill)"
            summary: "Answered by the Data Agent product_master_agent over BigQuery"
            views:
              - { view: table, from: ca_by_category.rows }
          - title: "Product listings by sales channel (via CA skill)"
            summary: "Same Data Agent, second question"
            views:
              - { view: table, from: ca_by_channel.rows }

    metadata:
      version: 1
      effective_from: 2026-08-10
      priority: 5
      requires_human_approval: true

      # EMPTY ON PURPOSE. The `skill:` blocks above bypass this scope entirely
      # (_run_step_skill -> _invoke_skill -> call_skill, no scope check). This list only
      # feeds the GATE's tool loop — listing the skill here would let the gate call CA a
      # third time mid-decision, which the policy rules below forbid.
      tools:
        skills: []
        allow_unlisted_skills: false

      # No `source: semantic_model` key: that is the context-graph route the sibling
      # process exercises. This one tests the skill path only.
      context_package:
        - { key: scheduled_at, source: event, required: false }

      policy_rules:
        - "`ca_by_category` and `ca_by_channel` are the results of the \"Google Conversational Analytics\" skill, invoked directly by this process's steps. They are already gathered — do NOT re-query, do NOT call a skill, and do NOT list every row."
        - "Gemini wrote and ran the SQL inside Google Conversational Analytics. No semantic model file was read and no SQL was generated by our own engine — do not refer to a verified query or to context-graph in the summary."
        - "Each fact carries `success`, `rows`, `columns`, `row_count` and `sql`. On failure it carries `error` and `message` — report those verbatim."
        - "Recommend APPROVE when at least one fact has rows; REJECT when both failed."

      actions:
        - name: acknowledge_ca_skill_test
          decision: APPROVE
          connector: notify
          config:
            type: notify
            recipient: data_team
            message: "Conversational Analytics skill path verified — a process step named the skill and the Data Agent answered over BigQuery."

        - name: dismiss_ca_skill_test
          decision: REJECT
          connector: simulated
          config:
            type: simulated
            note: "CA skill smoke test returned no rows. Read the skill's own `error`/`message` first. Then check, in order: (1) the google-conversational-analytics connector is connected for this org, with the GCP project AND the agent's region — a region mismatch returns 403 'Read access to project was denied', which looks like a permissions problem but is a wrong-endpoint problem; (2) the agent is ticked in the connect dialog's picker, which is what makes the display name `product_master_agent` resolve — otherwise paste the raw agent id; (3) the 'Google Conversational Analytics' skill is seeded (make seed-skill SKILL='google-conversational-analytics') and enabled for the running user; (4) the service account has Gemini Data Analytics Data Agent User on the agent plus BigQuery Data Viewer/Job User; (5) compare with the sibling product_master_semantic_smoke_test — if that one works and this doesn't, the problem is the connector/skill, not the agent."
