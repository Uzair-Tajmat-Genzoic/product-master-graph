version: 1

# POC demo (use cases 26.0 + 27.0). Illustrative process definition — steps
# omit required_skill / decision_template so the graph loads standalone.
# The last step's write-back is an external action connector, not graph data.

processes:
  - id: shelf_life_liquidation
    name: Shelf-Life Risk & Liquidation
    description: |
      Daily sweep of near-expiry stock across dark stores. For each surplus,
      near-expiry SKU: confirm the store won't sell it in time (forecast),
      find a nearby store that will (transfer route), and route one HITL
      approval to the action connector (transfer or markdown).
    domain: SupplyChain
    owner: supply_chain_team

    applies_to:
      - entity: Store
      - entity: Product

    triggers:
      - { type: schedule, cron: "0 6 * * *" }        # daily 06:00
      - { type: event, event_type: WastageFlagged }
      - { type: manual, allowed_roles: [DemandPlanner] }

    inputs:
      - { name: master_store_id, type: reference, references: Store,   required: true }
      - { name: sku,             type: reference, references: Product, required: true }

    outputs:
      - { name: action_taken, type: enum, values: [transfer, markdown, accept_wastage] }

    steps:
      - id: pull_at_risk
        name: Pull at-risk stock (stocked_at wastage & expiry flags)
        type: agent
      - id: check_demand
        name: Read forecast_for at this store — is the stock surplus?
        type: agent
        after: pull_at_risk
      - id: find_destination
        name: Walk transfer_route to nearby stores forecast to sell it
        type: agent
        after: check_demand
      - id: approve
        name: Demand owner approves transfer / markdown plan (HITL)
        type: human
        after: find_destination
      - id: execute
        name: Write transfer / markdown via action connector (ERPNext / channel)
        type: conditional
        after: approve
        condition: "action_taken != 'accept_wastage'"

    related_kpis: [WastageRisk, ForecastAccuracy]

    metadata:
      version: 1
      effective_from: 2026-07-11
